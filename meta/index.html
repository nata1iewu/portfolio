<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Commits Visualization</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <main>
        <section class="github-stats">
            <h2>Summary</h2>
            <div id="stats"></div>
        </section>

        <section>

            <svg id="chart"></svg>

            <div id="tooltip"></div>

            <div id="selection-summary"></div>
        </section>
    </main>

    <script type="module" src="main.js"></script>
</body>

</html>
