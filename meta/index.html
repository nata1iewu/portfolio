<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Commits Visualization</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <main>
        <div class="commit-filter">
            <label for="commit-progress">Show commits until:</label>
            <input type="range" id="commit-progress" min="0" max="100" value="100">
            <time id="commit-time"></time>
        </div>
        <section class="github-stats">
            <h2>Summary</h2>
            <div id="stats"></div>
        </section>

        <div id="scrolly-1">

            <div id="files"></div>

            <div id="scatter-story"></div>

            <div id="scatter-plot">
                <section>
                    <h2>Commits by time of day</h2>
                    <svg id="chart"></svg>
                    <div id="tooltip"></div>
                    <div id="selection-summary"></div>
                </section>
            </div>

        </div>
    </main>
    <script type="module" src="../global.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
